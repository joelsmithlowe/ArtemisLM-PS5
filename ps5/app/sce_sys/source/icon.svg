<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- ArtemisLM's icon. "PS5LM Mono" is the fontconfig family from
       scripts/artwork-fonts.py (site/assets/fonts/recursive-mono-v1). The
       llama.cpp line stays as a credit. "Artemis" does not fit at the old
       172px size, so the word is smaller and LM sits under it. -->
  <defs>
    <radialGradient id="glow" cx="88%" cy="96%" r="80%">
      <stop offset="0" stop-color="#8288f0" stop-opacity="0.34"/>
      <stop offset="0.6" stop-color="#8288f0" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#8288f0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="#0e0e14"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <text x="40" y="88" font-family="PS5LM Mono" font-weight="400" font-size="28" fill="#ebebf5" fill-opacity="0.55">llama.cpp</text>
  <text x="36" y="250" font-family="PS5LM Mono" font-weight="800" font-size="86" fill="#f2f2f7" letter-spacing="-2">Artemis</text>
  <text x="36" y="430" font-family="PS5LM Mono" font-weight="800" font-size="148" fill="#8288f0" letter-spacing="-4">LM</text>
</svg>
