<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 3840 2160">
  <!-- ArtemisLM's home screen background (pic0/pic1). scripts/build-app.sh turns
       it into the BC7 DDS files the console reads. "PS5LM Mono" is the
       fontconfig family name; the word is smaller than the old PS5LM lockup
       so ArtemisLM ends before the right edge. -->
  <defs>
    <radialGradient id="glow" cx="78%" cy="70%" r="60%">
      <stop offset="0" stop-color="#8288f0" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#8288f0" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#8288f0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M120 0H0V120" fill="none" stroke="#ebebf5" stroke-opacity="0.035" stroke-width="2"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0e0e14" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#0e0e14" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="3840" height="2160" fill="#0e0e14"/>
  <rect width="3840" height="2160" fill="url(#grid)"/>
  <rect width="3840" height="2160" fill="url(#fade)"/>
  <rect width="3840" height="2160" fill="url(#glow)"/>
  <text x="2200" y="1560" font-family="PS5LM Mono" font-weight="800" font-size="220" letter-spacing="-6"><tspan fill="#f2f2f7">Artemis</tspan><tspan fill="#8288f0">LM</tspan></text>
  <text x="2212" y="1720" font-family="PS5LM Mono" font-weight="400" font-size="64" fill="#ebebf5" fill-opacity="0.55">llama.cpp on PlayStation 5</text>
</svg>
